<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio SFX · EvoCut</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#111516;color:#e9f1ee}
body{margin:2rem auto;padding:0 1.2rem;max-width:64rem}h1{font-size:clamp(2rem,6vw,4rem);margin:0}header p{color:#aac2b6}
section{position:sticky;top:0;background:#111516;padding:1rem 0;border-bottom:1px solid #44564d}
input,select,button{font:inherit;padding:.45rem .7rem;max-width:100%}audio{width:100%;height:36px;margin:.5rem 0}
ul{padding:0;list-style:none}li{border-bottom:1px solid #35443b;padding:.6rem 0;display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center}
small{display:block;color:#b0c1b9}a{color:#9edaca}button{cursor:pointer}output{display:block}
</style>
<header><h1>Studio SFX</h1><p>EvoCut · 617 offline sounds across 32 categories</p></header>
<section><label>Search <input id="q" type="search" placeholder="e.g. mechanical keyboard"></label>
<label>Category <select id="cat"><option value="">All categories</option></select></label>
<audio id="player" controls preload="none"></audio><output id="now" aria-live="polite">Select a sound to listen.</output></section>
<p id="count"></p><ul id="list"></ul>
<script id="catalog" type="application/json">__EVOCUT_ITEMS__</script>
<script>
const rows=JSON.parse(document.getElementById('catalog').textContent);
const el=id=>document.getElementById(id),cat=el('cat'),q=el('q'),list=el('list'),player=el('player');
for(const name of [...new Set(rows.map(x=>x.category))].sort())cat.add(new Option(name,name));
function show(){
  const term=q.value.toLowerCase().trim(),found=rows.filter(x=>(!cat.value||cat.value===x.category)&&[x.title,x.category,x.author,x.license].join(' ').toLowerCase().includes(term));
  el('count').textContent=found.length+' sounds';list.replaceChildren();
  for(const x of found){const li=document.createElement('li'),b=document.createElement('button'),t=document.createElement('div'),s=document.createElement('small');b.type='button';b.textContent='Play';b.setAttribute('aria-label','Play '+x.title);
    b.onclick=()=>{player.src=x.path;el('now').textContent=x.title;player.play().catch(()=>{el('now').textContent='Could not play: '+x.path})};
    t.textContent=x.title;s.textContent=[x.category,x.duration.toFixed(2)+' s',x.author,x.license].join(' · ');
    if(x.source_url){const a=document.createElement('a');a.href=x.source_url;a.textContent='Original source';s.append(' · ',a)}
    t.append(s);li.append(b,t);list.append(li);}
}
q.addEventListener('input',show);cat.addEventListener('change',show);show();
</script></html>
