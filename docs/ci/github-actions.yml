# To enable, copy to .github/workflows/test.yml using credentials with workflow
# write permission. This template does not run while stored under docs/ci.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: npm test
      - run: npm run setup -- --install-engine
      - run: npm run evocut -- release verify
