<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EvoCut smoke example</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:640px;height:360px;overflow:hidden;background:#15181b;color:#f5f7f8;font-family:Arial,sans-serif}
